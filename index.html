<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Sesión</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

    <!-- Encabezado tipo home banking -->
    <header class="app-header">
        <div class="app-header__brand">🏦 Wallet Challenge</div>
    </header>

    <p class="login-security">🔒 Conexión segura - Tus datos están protegidos</p>
    
    <main class="login-page">
        <section class="login-card">
            <h1 class="login-title">Ingreso al Home Banking</h1>
            <p class="login-subtitle">Accedé con tu usuario y contraseña</p>

            <form id="login-form" class="login-form" data-testid="login-form">
                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    data-testid="username-input"
                    autocomplete="username"
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    data-testid="password-input"
                    autocomplete="current-password"
                >

                <button type="submit" data-testid="login-button">Iniciar Sesión</button>
            </form>

            <div id="response" class="response login-response" data-testid="login-response">
                <div id="success-message" class="success" style="display: none;" data-testid="success-message">
                    ✔ Inicio de sesión exitoso
                </div>
                <div id="error-message" class="error" style="display: none;" data-testid="error-message">
                    ✘ Error de autenticación
                </div>
                <div id="warning-message" class="warning" style="display: none;" data-testid="warning-message">
                    ⚠ Advertencia
                </div>
            </div>
        </section>
    </main>

    <script src="ajv.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
