<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet Challenge - Home Banking</title>

  <link rel="stylesheet" href="styles.css">
  <script src="cuentas.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="app-header__brand">🏦 Wallet Challenge</div>
  </header>

  <!-- Encabezado principal -->
  <h1 class="home-title">Wallet Challenge</h1>
  <p class="home-subtitle">¡Bienvenido! Ha iniciado sesión correctamente.</p>


    
  <!-- Panel superior -->
  <div class="top-panel">

    <div class="operation-row">
      <div class="operation-group">
        <div class="field-block">
          <label for="tarjeta">Tarjeta</label>
<select
  id="tarjeta"
  data-testid="tarjeta-select"
>
  <option value="">Seleccionar tarjeta</option>
<option value="825840853443">Visa •••• 3443</option>
<option value="423455721156">Mastercard •••• 1156</option>
<option value="595278769781">Amex •••• 9781</option>
</select>
        </div>
        <button onclick="callApi('cuentas')" data-testid="cuentas-button">
          Consultar cuentas
        </button>
      </div>

      <div class="cuenta-saldo-wrapper">
      <div class="operation-group">
        <div class="field-block">
          <label for="cuenta">Cuenta</label>
          <input
            type="text"
            id="cuenta"
            data-testid="cuenta-input"
            placeholder="Ingrese número de cuenta"
            value=""
          >
        </div>
        <button onclick="callApi('saldo')" data-testid="saldo-button">
          Consultar saldo
        </button>
      </div>
          <!-- NUEVO: contenedor del saldo -->

    </div>

    <div class="secondary-actions">
      <button onclick="callApi('endpoint3')" data-testid="movimientos-button" disabled>
        Movimientos
      </button>
      <button onclick="callApi('endpoint4')" data-testid="pago-button" disabled>
        Pago
      </button>
      <button onclick="callApi('endpoint5')" data-testid="estado-button" disabled>
        Estado
      </button>
      <button onclick="callApi('endpoint6')" data-testid="salir-button">
        Salir
      </button>
    </div>

  </div>

  <!-- Sección usuario -->
  <h3 class="section-title" onclick="toggleSection('usuario')" data-testid="toggle-usuario">
    ▶ Datos del usuario
  </h3>
  <div id="section-usuario" class="section-content" data-testid="section-usuario">
    <div id="responseUsuario" class="response" data-testid="response-usuario"></div>
  </div>

  <!-- Sección cuentas -->
  <h3 class="section-title" onclick="toggleSection('cuentas')" data-testid="toggle-cuentas">
    ▶ Cuentas
  </h3>
  <div id="section-cuentas" class="section-content" data-testid="section-cuentas">
    <div id="responseCuentas" class="response" data-testid="response-cuentas"></div>
    <div id="saldoInline" class="saldo-inline"></div>
  </div>

  <!-- Sección saldo -->
  <h3 class="section-title" onclick="toggleSection('saldo')" data-testid="toggle-saldo">
    ▶ Saldo
  </h3>
  <div id="section-saldo" class="section-content" data-testid="section-saldo">
    <div id="responseSaldo" class="response" data-testid="response-saldo"></div>
  </div>

  <script>
    function getSectionTitle(section) {
      if (section === "usuario") return "Datos del usuario";
      if (section === "cuentas") return "Cuentas";
      if (section === "saldo") return "Saldo";
      return section;
    }

    function openSection(section) {
      const container = document.getElementById(`section-${section}`);
      const title = document.querySelector(`[data-testid="toggle-${section}"]`);

      container.style.display = "block";
      title.textContent = `▼ ${getSectionTitle(section)}`;
    }

    function closeSection(section) {
      const container = document.getElementById(`section-${section}`);
      const title = document.querySelector(`[data-testid="toggle-${section}"]`);

      container.style.display = "none";
      title.textContent = `▶ ${getSectionTitle(section)}`;
    }

    function toggleSection(section) {
      const container = document.getElementById(`section-${section}`);

      if (container.style.display === "none") {
        openSection(section);
      } else {
        closeSection(section);
      }
    }

    const rawData = localStorage.getItem('DatosUsuario');
    if (rawData) {
      const data = JSON.parse(rawData);
      document.getElementById('responseUsuario').innerHTML = getTablaDatosUsuario(data);
    }

    // Estado inicial
    openSection("usuario");
    closeSection("cuentas");
    closeSection("saldo");
  </script>

</body>
</html>
