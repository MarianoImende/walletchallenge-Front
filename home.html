<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Acceso a la API</title>

  <!-- Enlace al nuevo archivo de estilos unificado -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Archivo de JavaScript -->
  <script src="cuentas.js"></script>
</head>
<body>
  <!-- Encabezado principal -->
  <h1>Wallet Challenge</h1>
  <p>¡Bienvenido! Ha iniciado sesión correctamente.</p>

  <!-- Controles interactivos -->
  <div class="buttons-container">
    <button onclick="callApi('cuentas')">Cuentas</button>
    <input type="text" id="tarjeta" placeholder="Ingrese número de tarjeta" value="">
    <input type="text" id="cuenta" placeholder="Ingrese número de cuenta" value="">
    <button onclick="callApi('Saldo')">Saldo</button>
    <button onclick="callApi('endpoint3')">Movimientos</button>
    <button onclick="callApi('endpoint4')">Pago</button>
    <button onclick="callApi('endpoint5')">Estado</button>
    <button onclick="callApi('endpoint6')">Salir</button>
  </div>

  <!-- Respuesta del API -->
  <div id="responseCuentas" class="response"></div>
  <div id="responseSaldo" class="response"></div>
  <div id="responseUsuario" class="response"></div>


</body>
<script>
 
  const data = JSON.parse(localStorage.getItem('DatosUsuario'));
  responseUsuario.innerHTML = getTablaDatosUsuario(data);

</script>
</html>
