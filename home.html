<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página de Acceso a la API</title>

  <!-- Enlace al nuevo archivo de estilos unificado -->

</head>
<body>
  <!-- Encabezado principal -->

  <!-- Controles interactivos -->
  <div class="buttons-container">
    <button onclick="callApi('cuentas')" data-testid="cuentas-button">Cuentas</button>
    <input type="text" id="tarjeta"  data-testid="tarjeta-input" placeholder="Ingrese número de tarjeta" value="">
    <input type="text" id="cuenta"  data-testid="cuenta-input" placeholder="Ingrese número de cuenta" value="">
    <button onclick="callApi('saldo')" data-testid="saldo-button">Saldo</button>
    <button onclick="callApi('endpoint3')">Movimientos</button>
    <button onclick="callApi('endpoint4')">Pago</button>
    <button onclick="callApi('endpoint5')">Estado</button>
    <button onclick="callApi('endpoint6')">Salir</button>
  </div>

  <!-- Respuesta del API -->
  <div id="responseCuentas" data-testid="response-cuentas" class="response"></div>
  <div id="responseSaldo" data-testid="response-saldo" class="response"></div>
  <div id="responseUsuario" data-testid="response-Usuario" class="response"></div>


</body>
